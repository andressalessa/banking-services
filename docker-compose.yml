services:
  postgres:
    image: postgres:16-alpine
    container_name: banking-services-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: banking_services
      POSTGRES_USER: banking_user
      POSTGRES_PASSWORD: banking_pass_dev_123
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U banking_user -d banking_services']
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: banking-services-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@banking.local
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - '5050:80'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
